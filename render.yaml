# Render blueprint: a web service plus a managed Postgres.
# Deploy with: Render dashboard -> New -> Blueprint -> point at this repo.
services:
  - type: web
    name: job-board-api
    runtime: node
    plan: free
    region: frankfurt
    # --include=dev is required, not optional. NODE_ENV below is set at build
    # time as well as at runtime, and npm omits devDependencies whenever
    # NODE_ENV=production — which would leave typescript and @types/node out
    # and fail `npm run build` on the first deploy.
    #
    # Migrations and the seed run here rather than in startCommand. On the free
    # tier the instance sleeps after ~15 minutes idle and re-runs startCommand
    # on every wake, so whatever lives there is paid for by the next visitor.
    # Measured on this service: a cold start was 43.0s, of which ~20s was
    # `npx prisma migrate deploy` plus the seed — and ~12s of that ~20s was npx
    # resolving the binary and tsx compiling prisma.config.ts, not the
    # migration, which is a no-op once applied. Running them at build time
    # means once per deploy instead of once per wake. The seed is idempotent,
    # so demo data is restored without duplicating rows.
    #
    # The tradeoff is real: the database is migrated before the new code is
    # live, so a deploy that fails after the build leaves the schema ahead of
    # the running release. `preDeployCommand` is the better home for this and
    # keeps that ordering honest, but it requires a paid instance type.
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build && npx prisma migrate deploy && node dist/prisma/seed.js
    # Nothing but the server — this is the wake path, so keep it empty of work.
    startCommand: node dist/src/server.js
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: job-board-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Render terminates TLS at a single load balancer in front of the app, so
      # the client IP is one hop away. An exact count, never `true`.
      - key: TRUST_PROXY_HOPS
        value: 1
      - key: CORS_ORIGIN
        sync: false

databases:
  - name: job-board-db
    plan: free
    region: frankfurt
